[project]
name = "automacao-edital"
version = "0.1.0"
description = "Verificador Automatizado de Editais e Submissões"
requires-python = ">=3.10"
dependencies = [
    "pydantic>=2.5",
    "pymupdf>=1.24",
    "python-docx>=1.1",
    "odfpy>=1.4",
    "google-genai>=1.0",
    "pytest>=8.0",
    "pandas>=2.0",
    "streamlit>=1.30",
    "gdown>=5.0",
]

[tool.pdm.scripts]
resumo = "python gerar_resumo.py"
app = "streamlit run app_streamlit.py"
test = "pytest tests/test_analise_editais.py"
