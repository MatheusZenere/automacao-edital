[project]
name = "automacao-edital"
version = "0.1.0"
description = "Verificador Automatizado de Editais e Submissões"
requires-python = ">=3.10"
dependencies = [
    "pydantic>=2.5",
    "pymupdf>=1.24",
    "python-docx>=1.1",
    "odfpy>=1.4",
    "google-genai>=1.0",
    "pandas>=2.0",
    "streamlit>=1.30",
    "gdown>=5.0",
    "requests>=2.31",
]

[tool.pdm.scripts]
resumo = "python scripts/gerar_resumo.py"
app = "streamlit run app/streamlit_app.py"
test = "pytest tests"

[dependency-groups]
dev = ["pytest>=8.0"]
